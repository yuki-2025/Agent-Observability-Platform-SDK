[project]
name = "propio-obs-sdk"
version = "0.0.1"
description = "Propio agent observability SDK — unified verb layer over LangSmith / Datadog / Propio DB"
requires-python = ">=3.11"
authors = [{ name = "Propio AI Platform" }]
readme = "README.md"

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    # Optional backends are loaded lazily inside exporter modules so a partial install works.
    # Listed as full deps for v0 since propio uses all four:
    "langsmith>=0.7",
    "ddtrace>=2.0",
    "datadog-api-client>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propio_obs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
