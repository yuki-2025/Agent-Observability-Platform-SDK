[project]
name = "propio-obs-sdk"
version = "0.0.1"
description = "Propio agent observability SDK — unified verb layer over LangSmith / Datadog / Propio DB"
requires-python = ">=3.11"
authors = [{ name = "Propio AI Platform" }]
readme = "README.md"

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    # OpenTelemetry — single wire format for traces + logs. Collector relay
    # handles fan-out to Datadog / LangSmith.
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    # OpenAI auto-instrumentation — replaces langsmith.wrappers.wrap_openai
    "opentelemetry-instrumentation-openai-v2>=2.0.0b0",
    # asyncpg for postgres_db exporter (not OTel — domain events DB)
    "asyncpg>=0.29",
    # Kept for backwards compatibility with back-compat function-level API
    # (record_stt / record_tts / turn_trace). New code should not use these.
    "langsmith>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propio_obs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
